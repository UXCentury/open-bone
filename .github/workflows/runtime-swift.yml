# Swift package: conformance suite on Linux and macOS; on macOS the Metal / AppKit / SwiftUI views compile, and the
# package is also built for iOS.
name: Swift runtime

on:
  push:
    branches: [main]
    paths:
      - "runtimes/swift/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-swift.yml"
  pull_request:
    paths:
      - "runtimes/swift/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-swift.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The Ubuntu runner image ships Swift (and curl, zstd), so no container or apt-get step is needed.
      - run: swift --version
      - uses: actions/cache@v6
        with:
          path: runtimes/swift/Sources/CQuickJS/vendor
          key: quickjs-${{ hashFiles('runtimes/swift/scripts/fetch-quickjs.sh') }}
      - uses: actions/cache@v6
        with:
          path: runtimes/swift/.build
          key: swiftpm-linux-runner-${{ hashFiles('runtimes/swift/Package.swift', 'runtimes/swift/Sources/**', 'runtimes/cpp/src/**', 'runtimes/cpp/include/**') }}
          restore-keys: swiftpm-linux-runner-
      - run: test -f runtimes/swift/Sources/CQuickJS/vendor/quickjs.c || runtimes/swift/scripts/fetch-quickjs.sh
      - run: swift test
        working-directory: runtimes/swift

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: runtimes/swift/Sources/CQuickJS/vendor
          key: quickjs-${{ hashFiles('runtimes/swift/scripts/fetch-quickjs.sh') }}
      - uses: actions/cache@v6
        with:
          path: runtimes/swift/.build
          key: swiftpm-macos-${{ hashFiles('runtimes/swift/Package.swift', 'runtimes/swift/Sources/**', 'runtimes/cpp/src/**', 'runtimes/cpp/include/**') }}
          restore-keys: swiftpm-macos-
      - run: test -f runtimes/swift/Sources/CQuickJS/vendor/quickjs.c || runtimes/swift/scripts/fetch-quickjs.sh
      - run: swift test
        working-directory: runtimes/swift
      - name: Build for iOS
        working-directory: runtimes/swift
        run: xcodebuild build -scheme OpenBone -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
