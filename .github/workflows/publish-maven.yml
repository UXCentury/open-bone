# Publishes the Java/Kotlin/Android libraries to Maven Central (Sonatype Central Portal) as io.openbone:
# openbone-runtime, openbone-scripting, openbone-gdx (jars) and openbone-android (AAR), each with sources, javadoc,
# Gradle module metadata, POM and PGP signatures. Built with com.vanniktech.maven.publish (runtimes/java/build.gradle.kts).
#
# - On a published GitHub release (tag v<version>, matching `version` in runtimes/java/build.gradle.kts) it tests,
#   signs, uploads and releases the deployment (automatic release once the Central Portal has validated it).
# - Run it by hand (Actions → Publish Maven packages → Run workflow) for a dry run: test and publishToMavenLocal only,
#   then upload the local repository as a workflow artifact. Untick "dry-run" to publish the selected ref.
#
# Secrets (see docs/releasing.md):
# - MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD: a Central Portal user token (central.sonatype.com → View Account →
#   Generate User Token), for an account that has verified the io.openbone namespace.
# - SIGNING_KEY: the ASCII-armored private PGP key (gpg --armor --export-secret-keys <KEY_ID>), its public key on a keyserver.
# - SIGNING_KEY_PASSWORD: the key's passphrase (empty if it has none).
# A version can be published to Maven Central only once; bump the version (scripts/version.ts) before re-releasing.
name: Publish Maven packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: build, test and publishToMavenLocal only, do not upload to Maven Central"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Credentials live on the protected "release" environment (Settings → Environments), like the desktop signing
    # secrets: a run reads them only after a required reviewer approves it.
    environment: release
    defaults:
      run:
        working-directory: runtimes/java
    env:
      PUBLISH: ${{ github.event_name == 'release' || inputs.dry-run == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the Android SDK
        # The runner's ANDROID_HOME makes settings.gradle.kts include :openbone-android; without it the AAR would be
        # silently skipped.
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not set; openbone-android would not be built"; exit 1
          fi
      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -nE 's/^\s*version = "([^"]+)".*/\1/p' build.gradle.kts | head -1)
          if [ -z "$version" ]; then echo "::error::No version found in runtimes/java/build.gradle.kts"; exit 1; fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match the Java runtime version $version (expected v$version)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"
      - name: Check credentials
        if: env.PUBLISH == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=""
          for s in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing Maven Central secrets::Set the repository secrets:$missing (and SIGNING_KEY_PASSWORD if the key has a passphrase), or run with dry-run ticked. See docs/releasing.md."
            exit 1
          fi
      - run: ./gradlew build --no-daemon
      - name: Publish to the local Maven repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Signs too when SIGNING_KEY is set, which checks the key before a real upload.
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKey="$SIGNING_KEY"
            export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$SIGNING_KEY_PASSWORD"
          fi
          ./gradlew publishToMavenLocal --no-daemon
          dir="$HOME/.m2/repository/io/openbone"
          version="${{ steps.version.outputs.version }}"
          for m in openbone-runtime openbone-scripting openbone-gdx openbone-android; do
            ext=jar; [ "$m" = openbone-android ] && ext=aar
            for f in "$m-$version.$ext" "$m-$version-sources.jar" "$m-$version-javadoc.jar" "$m-$version.pom" "$m-$version.module"; do
              test -f "$dir/$m/$version/$f" || { echo "::error::missing $m/$version/$f"; exit 1; }
            done
          done
          find "$dir" -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: maven-${{ steps.version.outputs.version }}
          path: ~/.m2/repository/io/openbone
          if-no-files-found: error
      - name: Publish to Maven Central
        if: env.PUBLISH == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # One deployment for all four modules; released automatically once the Central Portal has validated it.
        run: |
          ./gradlew publishToMavenCentral --no-daemon
          {
            echo "### Uploaded to Maven Central"
            for m in openbone-runtime openbone-scripting openbone-gdx openbone-android; do
              echo "- [io.openbone:$m:${{ steps.version.outputs.version }}](https://central.sonatype.com/artifact/io.openbone/$m/${{ steps.version.outputs.version }})"
            done
            echo "Validated deployments are released automatically; they reach repo1.maven.org within about 30 minutes."
            echo "Status: https://central.sonatype.com/publishing/deployments"
          } >> "$GITHUB_STEP_SUMMARY"
