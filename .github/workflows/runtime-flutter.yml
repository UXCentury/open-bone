# Flutter plugin: conformance, API and widget tests on Linux and macOS, `flutter analyze`, and the example app built
# for Linux, Android, macOS, iOS (unsigned) and Windows.
name: Flutter runtime

on:
  push:
    branches: [main]
    paths:
      - "runtimes/flutter/openbone/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "runtimes/cpp/CMakeLists.txt"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-flutter.yml"
  pull_request:
    paths:
      - "runtimes/flutter/openbone/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "runtimes/cpp/CMakeLists.txt"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-flutter.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ninja-build libgtk-3-dev
          version: 1
      - name: Test
        working-directory: runtimes/flutter/openbone
        run: |
          flutter pub get
          tool/build_native.sh
          flutter analyze
          flutter test
      - name: Build the example (Linux, Android)
        working-directory: runtimes/flutter/openbone/example
        run: |
          flutter build linux
          # One ABI is enough to check the Android build (each ABI compiles the C++ runtime with the NDK).
          flutter build apk --debug --target-platform android-arm64

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Test
        working-directory: runtimes/flutter/openbone
        run: |
          flutter pub get
          tool/build_native.sh
          flutter test
      - name: Build the example (macOS, iOS) with Swift Package Manager
        working-directory: runtimes/flutter/openbone/example
        shell: bash  # -eo pipefail: a failed build fails the step despite tee
        run: |
          flutter config --enable-swift-package-manager
          ../tool/fetch_quickjs.sh
          flutter build macos 2>&1 | tee build-macos.log
          flutter build ios --no-codesign 2>&1 | tee build-ios.log
          # The plugin must build through its Package.swift, not fall back to CocoaPods.
          if grep -q "do not support Swift Package Manager" build-macos.log build-ios.log; then
            echo "::error::openbone fell back to CocoaPods"; exit 1
          fi

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the example (Windows)
        working-directory: runtimes/flutter/openbone/example
        run: flutter build windows
