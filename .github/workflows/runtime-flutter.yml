# Flutter plugin: conformance, API and widget tests on Linux and macOS, `flutter analyze`, and the example app built
# for Linux, Android, macOS, iOS (unsigned) and Windows.
name: Flutter runtime

on:
  push:
    branches: [main]
    paths:
      - "runtimes/dart/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "runtimes/cpp/CMakeLists.txt"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-flutter.yml"
  pull_request:
    paths:
      - "runtimes/dart/**"
      - "runtimes/cpp/include/**"
      - "runtimes/cpp/src/**"
      - "runtimes/cpp/CMakeLists.txt"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-flutter.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.3

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Test
        working-directory: runtimes/dart
        run: |
          flutter pub get
          tool/build_native.sh
          flutter analyze
          flutter test
      - name: Build the example (Linux, Android)
        working-directory: runtimes/dart/example
        run: |
          flutter build linux
          flutter build apk --debug

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Test
        working-directory: runtimes/dart
        run: |
          flutter pub get
          tool/build_native.sh
          flutter test
      - name: Build the example (macOS, iOS)
        working-directory: runtimes/dart/example
        run: |
          flutter build macos
          flutter build ios --no-codesign

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the example (Windows)
        working-directory: runtimes/dart/example
        run: flutter build windows
