# Desktop installers for the Tauri app (apps/desktop):
#   Windows .msi and .exe (NSIS) · macOS .dmg (universal: Apple Silicon + Intel) · Linux .deb, .rpm and .AppImage
#
# - Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build them all and attach them to a draft GitHub
#   Release for that tag. The tag must match the app version: set it first with `pnpm version:set 0.2.0`.
# - Or run it by hand (Actions → Desktop installers → Run workflow): without "Create a draft release" it only builds,
#   and the installers are kept as workflow artifacts for a few days.
#
# Code signing is optional: add the secrets listed in docs/releasing.md to sign and notarize the macOS app (Apple
# Developer ID) and sign the Windows app and installers (SSL.com OV certificate through eSigner). Without them the installers work, but macOS Gatekeeper and Windows SmartScreen warn on first open.
name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release (tag v<app version>)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows
            args: ""
          - os: macos-15
            label: macOS
            args: "--target universal-apple-darwin"
          # Ubuntu 22.04 links against an older glibc, so the .deb, .rpm and AppImage run on more distributions.
          - os: ubuntu-22.04
            label: Linux
            args: ""
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Signing secrets live on the protected "release" environment (Settings → Environments), so a run can only read
    # them after a required reviewer approves it.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      # WebKitGTK decodes and plays audio through GStreamer, so the AppImage bundles its plugins (bundleMediaFramework);
      # without them, importing an MP3 crashes the page. Hand the bundler only the LGPL core, base and good plugins,
      # never whatever else is installed (ugly, bad and libav include GPL code).
      - name: GStreamer plugins for the AppImage
        if: runner.os == 'Linux'
        run: |
          dir="$RUNNER_TEMP/gstreamer-plugins"
          mkdir -p "$dir"
          for pkg in libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good; do
            dpkg -L "$pkg" | grep -E '/gstreamer-1\.0/[^/]+\.so$' | xargs -r cp -t "$dir"
          done
          ls "$dir"
          echo "GSTREAMER_PLUGINS_DIR=$dir" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Signing secrets are passed only when they exist: an empty APPLE_CERTIFICATE would make the build try to sign.
      - name: Signing secrets (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      # Windows: sign with an SSL.com OV certificate through eSigner when its secrets exist (docs/releasing.md). Tauri runs
      # scripts/sign-windows.ps1 for the app .exe, the setup .exe and the .msi via a signCommand passed with --config.
      - name: Windows signing (optional)
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          if [ -z "$ES_USERNAME" ] || [ -z "$ES_PASSWORD" ] || [ -z "$ES_CREDENTIAL_ID" ] || [ -z "$ES_TOTP_SECRET" ]; then
            echo "No ES_* secrets: the Windows installers are not signed."
            exit 0
          fi
          # SSL.com CodeSignTool, pinned by version and checksum.
          curl -sSfL -o "$RUNNER_TEMP/cst.zip" https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          echo "4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b  $RUNNER_TEMP/cst.zip" | sha256sum -c -
          tool="$RUNNER_TEMP/CodeSignTool"
          unzip -q "$RUNNER_TEMP/cst.zip" -d "$tool"
          script=$(cygpath -w "$GITHUB_WORKSPACE/apps/desktop/src-tauri/scripts/sign-windows.ps1")
          node -e '
            const [script, out] = process.argv.slice(1);
            const cmd = { cmd: "powershell", args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", script, "%1"] };
            require("fs").writeFileSync(out, JSON.stringify({ bundle: { windows: { signCommand: cmd } } }));
          ' "$script" "$RUNNER_TEMP/sign.conf.json"
          {
            echo "CODE_SIGN_TOOL_PATH=$(cygpath -w "$tool")"
            for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do echo "$v=${!v}"; done
          } >> "$GITHUB_ENV"
          echo "args=--config $(cygpath -w "$RUNNER_TEMP/sign.conf.json")" >> "$GITHUB_OUTPUT"

      # Release notes: this version's section of CHANGELOG.md, then how to open installers that are not signed.
      - name: Release notes
        id: notes
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.ES_USERNAME != '' && secrets.ES_TOTP_SECRET != '' }}
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version;
            const log = fs.readFileSync("CHANGELOG.md", "utf8");
            const m = log.match(new RegExp("^## " + v.replace(/\./g, "\\.") + "\\b[^\\n]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))", "m"));
            const notes = m ? m[1].trim() : "See CHANGELOG.md for what changed.";
            const mac = process.env.MAC_SIGNED === "true", win = process.env.WIN_SIGNED === "true";
            const install = [
              "### Installing",
              "Download the installer for your system below.",
              mac
                ? "- **macOS**: signed and notarized by Apple; open the .dmg and drag OpenBone to Applications."
                : "- **macOS**: not signed yet. If Apple \"could not verify\" OpenBone, click Done, then in **System Settings → Privacy & Security** click **Open Anyway** next to OpenBone. Or run `xattr -dr com.apple.quarantine /Applications/OpenBone.app`.",
              win
                ? "- **Windows**: signed. A new certificate may still show SmartScreen until it has built up reputation: choose **More info** then **Run anyway**."
                : "- **Windows**: not signed yet. If SmartScreen appears, choose **More info** then **Run anyway**.",
              "- **Linux AppImage**: on newer Ubuntu install `libfuse2`, or run it with `--appimage-extract-and-run`.",
            ].join("\n");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/notes.md", notes + "\n\n" + install + "\n");
          '
          { echo "body<<__NOTES__"; cat "$RUNNER_TEMP/notes.md"; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
          # A release only for tags, or when asked for on a manual run; otherwise just build and keep artifacts.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release) && 'v__VERSION__' || '' }}
          releaseName: "OpenBone v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true

      # Tauri notarizes the app inside the .dmg, not the disk image itself, so opening the download could still warn.
      # Notarize and staple the .dmg too, then put it back in place of the one tauri-action uploaded (release and
      # workflow artifact). Runs only for signed macOS builds.
      - name: Notarize the disk image
        id: dmg
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          dmg=$(node -e 'console.log(JSON.parse(process.env.ARTIFACTS).find(p => p.endsWith(".dmg")) || "")')
          if [ -z "$dmg" ]; then echo "::error::No .dmg among the build artifacts"; exit 1; fi
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Replace the disk image in the release
        if: steps.dmg.outputs.path != '' && steps.tauri.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "${{ steps.dmg.outputs.path }}" --clobber

      - name: Replace the disk image in the workflow artifact
        if: steps.dmg.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal-dmg
          path: ${{ steps.dmg.outputs.path }}
          overwrite: true
