# The documentation website (apps/website): build on every push to main and deploy it to Cloudflare at
# https://openbone.io (a static-assets Worker, apps/website/wrangler.jsonc). Pull requests build it too (broken links
# fail the build), without deploying.
#
# Deploying needs the repository secret CLOUDFLARE_API_TOKEN: a Cloudflare API token with Account → Workers Scripts:
# Edit and Zone (openbone.io) → Workers Routes: Edit. Without it the site is built and the deploy step is skipped.
name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths: ["apps/website/**", "docs/**", "**/README.md", "CHANGELOG.md", "SECURITY.md", "examples/**", "packages/player/**", "brand/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # page dates (last updated, sitemap) come from git history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbone/website build
      - name: Deploy to Cloudflare (openbone.io)
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN == 'true'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Deploy skipped
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
