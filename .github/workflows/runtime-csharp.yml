# C# runtime: conformance suite (dotnet test), the Unity package compiled against the Unity API stub, the MonoGame
# integration (library, sample and its window-less tests), and on Linux the NuGet packages and the assembled Unity
# package that publish-dotnet.yml / publish-unity.yml release.
name: C# runtime

on:
  push:
    branches: [main]
    paths:
      - "runtimes/csharp/**"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-csharp.yml"
  pull_request:
    paths:
      - "runtimes/csharp/**"
      - "conformance/**"
      - "examples/**/*.obone"
      - ".github/workflows/runtime-csharp.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtimes/csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('runtimes/csharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test
      - run: dotnet build unity/compile-check
      - run: dotnet test monogame/OpenBone.MonoGame.sln
      - name: Pack NuGet packages and assemble the Unity package
        if: runner.os == 'Linux'
        run: |
          dotnet pack OpenBone.sln -c Release -o "$RUNNER_TEMP/nupkgs"
          dotnet pack monogame/src/OpenBone.MonoGame -c Release -o "$RUNNER_TEMP/nupkgs"
          test "$(ls "$RUNNER_TEMP"/nupkgs/*.nupkg | wc -l)" -eq 3
          python3 unity/build-package.py --out "$RUNNER_TEMP/upm/package"
