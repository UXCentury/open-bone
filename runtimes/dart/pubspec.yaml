name: openbone
description: >-
  OpenBone runtime for Flutter and Dart: plays .obone / .obonb skeletal animations and state machines through the
  native C++ runtime (libopenbone) over dart:ffi, and draws them with Canvas.drawVertices.
version: 0.1.0
homepage: https://github.com/UXCentury/open-bone
repository: https://github.com/UXCentury/open-bone/tree/main/runtimes/dart
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.3

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Flutter 3.47.9 pins these two one patch release behind (via flutter / flutter_test); the newer patches are
# compatible (the whole test suite runs on them), and overriding them keeps `pub get` free of "outdated" notices.
# Overrides only apply when building this package itself, never in apps that depend on it.
dependency_overrides:
  material_color_utilities: ^0.13.1
  test_api: ^0.7.15

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
