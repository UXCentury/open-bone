name: openbone
description: >-
  OpenBone runtime for Flutter and Dart: plays .obone / .obonb skeletal animations and state machines through the
  native C++ runtime (libopenbone) over dart:ffi, and draws them with Canvas.drawVertices.
version: 0.1.0
homepage: https://github.com/UXCentury/open-bone
repository: https://github.com/UXCentury/open-bone/tree/main/runtimes/dart
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^13.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
