name: openbone_example
description: "OpenBone Flutter plugin example: the knight (animations) and the button (state machine + pointer)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  openbone:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Flutter 3.47.9 pins these two one patch release behind (via flutter / flutter_test); the newer patches are
# compatible (the whole test suite runs on them), and overriding them keeps `pub get` free of "outdated" notices.
# Overrides only apply when building this package itself, never in apps that depend on it.
dependency_overrides:
  material_color_utilities: ^0.13.1
  test_api: ^0.7.15

flutter:
  uses-material-design: true
  assets:
    - assets/openbone/
    - assets/openbone/assets/eleven/
    - assets/openbone/assets/eleven/audio/
    - assets/openbone/assets/canva/
