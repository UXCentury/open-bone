# Regenerate lib/src/bindings.g.dart from the C API header:
#   dart run ffigen --config ffigen.yaml
name: OpenBoneBindings
description: dart:ffi bindings for libopenbone (runtimes/cpp/include/openbone.h). Generated by ffigen; do not edit.
output: lib/src/bindings.g.dart
headers:
  entry-points:
    - ../../cpp/include/openbone.h
  include-directives:
    - ../../cpp/include/openbone.h
compiler-opts:
  - -DOPENBONE_STATIC
functions:
  include:
    - 'ob_.*'
structs:
  include:
    - 'ob_.*'
enums:
  include:
    - 'ob_.*'
macros:
  include:
    - 'OB_.*'
typedefs:
  include:
    - 'ob_.*'
preamble: |
  // SPDX-License-Identifier: MIT
  // ignore_for_file: type=lint, unused_field, unused_element
comments:
  style: any
  length: full
llvm-path:
  - /usr/lib/llvm-14
silence-enum-warning: true
